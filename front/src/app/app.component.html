<p-toolbar [style]="{ height: '100px' }">
    <div class="p-toolbar-group-start">
        <img src="assets/icons/icon-72x72.png" alt="logo" />
    </div>
    <div class="p-toolbar-group-center">
        {{ title }}
    </div>
    <div class="p-toolbar-group-end pr-2">
        <i class="pi pi-shopping-cart" style="font-size: 2rem" pBadge [value]="cartCount()" severity="danger" (click)="popover.toggle($event)" ></i>

      <p-overlayPanel #popover>
        @for (item of cart(); track item.product.id) {
          <div class="flex align-items-center gap-3 mb-2">

            <div class="flex-1">
              {{ item.product.name }}
            </div>

            <div class="text-right" style="min-width: 90px">
              {{ item.product.price | currency:'EUR':'symbol':'1.2-2':'fr-FR' }}
            </div>

            <button
              pButton
              icon="pi pi-minus"
              [text]="true"
              (click)="cartService.decrease(item.product.id)">
            </button>

            <div class="text-center">
              {{ item.quantity }}
            </div>

            <button
              pButton
              icon="pi pi-plus"
              [text]="true"
              (click)="cartService.add(item.product)">
            </button>

            <button
              pButton
              icon="pi pi-trash"
              severity="danger"
              [text]="true"
              (click)="cartService.remove(item.product.id)">
            </button>

          </div>
        } @empty {
          <p>Votre panier est vide.</p>
        }

        <p-divider />

        <div class="flex justify-content-between font-bold">
          <span>Total</span>
          <span>{{ cartTotal() | currency:'EUR':'symbol':'1.2-2':'fr-FR' }}</span>
        </div>
      </p-overlayPanel>

    </div>
</p-toolbar>
<p-splitter
    [panelSizes]="[20, 80]"
    [style]="{ height: 'calc(100vh - 100px)' }">
    <ng-template pTemplate>
        <div class="w-full">
            <app-panel-menu />
        </div>
    </ng-template>
    <ng-template pTemplate>
        <div class="w-full app-content">
            <router-outlet></router-outlet>
        </div>
    </ng-template>
</p-splitter>
